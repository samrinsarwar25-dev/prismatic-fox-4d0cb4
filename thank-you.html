<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thank you | Little Learners Books</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #fff8e7; color: #333; margin: 0; display: flex; min-height: 100vh; align-items: center; justify-content: center; }
    .card { background: #fff; max-width: 420px; margin: 16px; padding: 28px 24px; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,.1); text-align: center; }
    h1 { margin-top: 0; font-size: 1.5rem; }
    a.btn { display: inline-block; margin-top: 12px; padding: 14px 26px; background: #ff7a59; color: #fff; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 1.05rem; }
    small { display: block; margin-top: 18px; color: #777; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Thank you! 🎉</h1>
    <p>Your payment was received. Tap the button to download your book.</p>
    <a class="btn" id="dl" href="#">Download PDF</a>
    <small>We have also emailed the PDF to you. Check your spam folder if you don't see it. If you have any trouble, message us and we will send it.</small>
  </div>
  <script>
    var url = "/.netlify/functions/download" + location.search;
    document.getElementById("dl").setAttribute("href", url);
    setTimeout(function () { window.location.href = url; }, 800);
  </script>
</body>
</html>
