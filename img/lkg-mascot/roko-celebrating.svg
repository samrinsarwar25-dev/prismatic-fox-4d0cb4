<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
  <defs><style>.roko-skin { fill: #FFB6C1; stroke: #FF69B4; stroke-width: 2; } .roko-feature { fill: #26335a; } .roko-blush { fill: #FFB6C1; opacity: 0.6; } .roko-eye-white { fill: #ffffff; stroke: #26335a; stroke-width: 1.5; } .roko-eye-pupil { fill: #26335a; }</style></defs>
  <g transform="translate(100, 60)">
    <circle cx="0" cy="0" r="45" class="roko-skin"/>
  </g>
  <circle cx="65" cy="25" r="18" class="roko-skin"/>
  <circle cx="135" cy="25" r="18" class="roko-skin"/>
  <circle cx="65" cy="25" r="10" class="roko-blush"/>
  <circle cx="135" cy="25" r="10" class="roko-blush"/>
  <ellipse cx="100" cy="140" rx="38" ry="50" class="roko-skin"/>
  <!-- Raised arms in celebration -->
  <ellipse cx="55" cy="100" rx="14" ry="40" class="roko-skin" transform="rotate(-55 55 100)"/>
  <ellipse cx="145" cy="100" rx="14" ry="40" class="roko-skin" transform="rotate(55 145 100)"/>
  <circle cx="35" cy="55" r="12" class="roko-skin"/>
  <circle cx="165" cy="55" r="12" class="roko-skin"/>
  <ellipse cx="85" cy="195" rx="12" ry="16" class="roko-skin"/>
  <ellipse cx="115" cy="195" rx="12" ry="16" class="roko-skin"/>
  <!-- Celebration eyes - stars/sparkles -->
  <path d="M 76 45 L 80 52 L 87 52 L 81 57 L 84 64 L 78 60 L 72 64 L 75 57 L 69 52 L 76 52 Z" class="roko-feature"/>
  <path d="M 112 45 L 116 52 L 123 52 L 117 57 L 120 64 L 114 60 L 108 64 L 111 57 L 105 52 L 112 52 Z" class="roko-feature"/>
  <path d="M 100 55 L 97 62 L 103 62 Z" class="roko-feature"/>
  <!-- Big celebration smile -->
  <path d="M 82 74 Q 100 85 118 74" stroke="#26335a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Big blush marks -->
  <circle cx="65" cy="68" r="9" class="roko-blush"/>
  <circle cx="135" cy="68" r="9" class="roko-blush"/>
  <circle cx="100" cy="145" r="8" class="roko-blush"/>
</svg>