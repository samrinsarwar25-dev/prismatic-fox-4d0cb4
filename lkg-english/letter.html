<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learn Letter - LKG English</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/lkg-english.css">
  <link rel="stylesheet" href="./css/components.css">

  <style>
    :root {
      --navy: #26335a;
      --gold: #f5b942;
      --cream: #fffaf0;
      --paper: #ffffff;
      --pink: #e0607a;
      --teal: #2f9aa3;
      --muted: #5e6783;
      --line: #eadfc8;
      --lime: #7FBF4D;
    }

    body {
      margin: 0;
      font-family: 'Nunito', sans-serif;
      background: var(--cream);
      color: var(--navy);
    }

    header {
      padding: 20px 0;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 250, 240, 0.95);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .wrap {
      width: min(1100px, 100% - 32px);
      margin: 0 auto;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-weight: 700;
      text-decoration: none;
      color: var(--navy);
    }

    nav a {
      text-decoration: none;
      color: var(--muted);
      margin-left: 20px;
      font-weight: 700;
    }

    main {
      padding: 40px 0;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--navy);
      font-weight: 700;
      margin-bottom: 20px;
    }

    .letter-display {
      background: linear-gradient(135deg, rgba(245, 185, 66, 0.1), rgba(47, 154, 163, 0.1));
      border: 3px solid var(--gold);
      border-radius: 24px;
      padding: 40px;
      text-align: center;
      margin-bottom: 40px;
      animation: slideIn 0.5s ease-out;
    }

    .letter-display h1 {
      font-size: clamp(4rem, 10vw, 6rem);
      margin: 0;
      font-family: 'Fredoka', sans-serif;
      color: var(--navy);
      font-weight: 700;
    }

    .letter-display .lowercase {
      font-size: 2rem;
      color: var(--muted);
      margin-top: 10px;
    }

    .letter-display .sound {
      font-size: 1.3rem;
      color: var(--teal);
      font-weight: 600;
      margin-top: 15px;
    }

    .letter-display .description {
      font-size: 1.1rem;
      color: var(--muted);
      margin-top: 10px;
      font-style: italic;
    }

    .content-grid {
      display: grid;
      gap: 24px;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      margin-bottom: 40px;
    }

    .card {
      background: var(--paper);
      border: 2px solid var(--line);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 12px rgba(38, 51, 90, 0.08);
      transition: all 0.3s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--gold);
      box-shadow: 0 8px 20px rgba(38, 51, 90, 0.15);
    }

    .card h3 {
      margin: 0 0 16px;
      color: var(--navy);
      font-size: 1.3rem;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .words-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .word-badge {
      background: rgba(47, 154, 163, 0.1);
      color: var(--teal);
      padding: 8px 12px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .fun-fact {
      background: linear-gradient(135deg, rgba(245, 185, 66, 0.08), rgba(159, 89, 182, 0.08));
      border-left: 4px solid var(--gold);
      padding: 16px;
      border-radius: 8px;
      font-size: 1.05rem;
    }

    .navigation-buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-top: 40px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--navy);
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      font-weight: 700;
      font-family: 'Fredoka', sans-serif;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: #34457a;
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: var(--teal);
    }

    .btn-secondary:hover {
      background: #248793;
    }

    footer {
      background: var(--navy);
      color: white;
      padding: 30px 0;
      margin-top: 40px;
      text-align: center;
    }

    .loading {
      text-align: center;
      padding: 40px;
      font-size: 1.2rem;
      color: var(--muted);
    }

    .error {
      background: rgba(224, 96, 122, 0.1);
      border: 2px solid var(--pink);
      color: var(--pink);
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      font-weight: 600;
    }

    @media (max-width: 560px) {
      .letter-display {
        padding: 30px 20px;
      }

      .letter-display h1 {
        font-size: 4rem;
      }

      .content-grid {
        grid-template-columns: 1fr;
      }

      nav a:not(:first-child) {
        display: none;
      }
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap header-bar">
      <a href="./" class="brand">← Back to Dashboard</a>
      <nav>
        <a href="./alphabet.html">ABC</a>
        <a href="./phonics.html">Phonics</a>
        <a href="./">Home</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="wrap">
      <a href="./alphabet.html" class="back-link">← Back to Alphabet</a>

      <div id="letter-content" class="loading">
        Loading letter information...
      </div>

      <div class="navigation-buttons">
        <button class="btn" id="prev-btn" style="display: none;">← Previous Letter</button>
        <button class="btn btn-secondary" id="next-btn" style="display: none;">Next Letter →</button>
      </div>
    </div>
  </main>

  <footer>
    <div class="wrap">
      <p>&copy; 2026 Little Learners Studio | Learn with Roko! 🌟</p>
    </div>
  </footer>

  <script>
    // Get letter from URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    const letter = urlParams.get('letter')?.toUpperCase();

    if (!letter || letter.length !== 1) {
      document.getElementById('letter-content').innerHTML = '<div class="error">Invalid letter selected. Please go back and try again.</div>';
    } else {
      // Load letter data
      fetch('./data/letters.json')
        .then(response => response.json())
        .then(data => {
          const letterData = data.letters.find(l => l.uppercase === letter);

          if (!letterData) {
            document.getElementById('letter-content').innerHTML = '<div class="error">Letter not found in curriculum.</div>';
            return;
          }

          // Display letter information
          const content = `
            <div class="letter-display">
              <h1>${letterData.uppercase}</h1>
              <div class="lowercase">${letterData.lowercase}</div>
              <div class="sound">${letterData.sound}</div>
              <div class="description">${letterData.description}</div>
            </div>

            <div class="content-grid">
              <div class="card">
                <h3>📚 Words That Start With "${letterData.uppercase}"</h3>
                <div class="words-list">
                  ${letterData.words.map(word => `<div class="word-badge">${word}</div>`).join('')}
                </div>
              </div>

              <div class="card">
                <h3>💡 Fun Fact</h3>
                <div class="fun-fact">${letterData.funFact}</div>
              </div>
            </div>
          `;

          document.getElementById('letter-content').innerHTML = content;

          // Setup navigation buttons
          const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
          const currentIndex = letters.indexOf(letter);

          if (currentIndex > 0) {
            document.getElementById('prev-btn').style.display = 'inline-flex';
            document.getElementById('prev-btn').onclick = () => {
              window.location.href = `./letter.html?letter=${letters[currentIndex - 1]}`;
            };
          }

          if (currentIndex < letters.length - 1) {
            document.getElementById('next-btn').style.display = 'inline-flex';
            document.getElementById('next-btn').onclick = () => {
              window.location.href = `./letter.html?letter=${letters[currentIndex + 1]}`;
            };
          }
        })
        .catch(error => {
          console.error('Error loading letter data:', error);
          document.getElementById('letter-content').innerHTML = '<div class="error">Error loading letter information. Please try again.</div>';
        });
    }
  </script>
</body>
</html>
