<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parent Dashboard - LKG English</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/lkg-english.css">
  <style>
    :root { --navy: #26335a; --gold: #f5b942; --cream: #fffaf0; --paper: #ffffff; --pink: #e0607a; --muted: #5e6783; --line: #eadfc8; }
    body { margin: 0; font-family: 'Nunito', sans-serif; background: var(--cream); color: var(--navy); }
    header { padding: 20px 0; border-bottom: 1px solid var(--line); background: rgba(255, 250, 240, 0.92); }
    .wrap { width: min(1100px, 100% - 32px); margin: 0 auto; }
    main { padding: 40px 0; }
    .placeholder { padding: 40px; background: var(--paper); border: 2px dashed var(--line); border-radius: 20px; text-align: center; }
    h1 { font-size: 2.5rem; margin: 0 0 16px; }
  </style>
</head>
<body>
  <header>
    <div class="wrap" style="display: flex; justify-content: space-between;">
      <a href="./" style="font-weight: 700; text-decoration: none;">← Back</a>
    </div>
  </header>
  <main>
    <div class="wrap">
      <div class="placeholder">
        <h1>👨‍👩‍👧 Parent Dashboard</h1>
        <p style="color: var(--muted);">Monitor your child's learning progress and achievements.</p>
        <p style="color: var(--muted); margin-top: 24px;"><strong>Stage 9 of Development</strong></p>
      </div>
    </div>
  </main>
  <script src="./js/navigation.js"></script>
</body>
</html>
