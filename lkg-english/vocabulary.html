<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Picture Words - LKG English</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/lkg-english.css">
  <style>
    :root { --navy: #26335a; --gold: #f5b942; --cream: #fffaf0; --paper: #ffffff; --pink: #e0607a; --muted: #5e6783; --line: #eadfc8; }
    body { margin: 0; font-family: 'Nunito', sans-serif; background: var(--cream); color: var(--navy); }
    header { padding: 20px 0; border-bottom: 1px solid var(--line); background: rgba(255, 250, 240, 0.92); }
    .wrap { width: min(1100px, 100% - 32px); margin: 0 auto; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; }
    .brand { font-weight: 700; text-decoration: none; }
    nav a { margin-right: 16px; text-decoration: none; color: var(--muted); }
    main { padding: 40px 0; }
    .coming-soon { text-align: center; padding: 60px 20px; }
    .coming-soon h1 { font-size: 2.5rem; margin-bottom: 16px; }
    .placeholder { padding: 40px; background: var(--paper); border: 2px dashed var(--line); border-radius: 20px; text-align: center; }
  </style>
</head>
<body>
  <header>
    <div class="wrap header-bar">
      <a href="./" class="brand">← Back to Home</a>
      <nav><a href="./">Dashboard</a></nav>
    </div>
  </header>
  <main>
    <div class="wrap">
      <div class="coming-soon">
        <div class="placeholder">
          <h1>🖼️ Picture Words</h1>
          <p>Learn 100+ English words with beautiful illustrations and pronunciations.</p>
          <p style="color: var(--muted); margin-top: 24px;"><strong>Stage 4 of Development</strong><br>Coming soon!</p>
        </div>
      </div>
    </div>
  </main>
  <script src="./js/navigation.js"></script>
</body>
</html>
